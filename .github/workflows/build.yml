name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Modèle vocal Vosk (français, hors ligne)
        run: |
          mkdir -p app/src/main/assets
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-fr-0.22.zip
          unzip -q m.zip
          mv vosk-model-small-fr-0.22 app/src/main/assets/model-fr
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-fr/uuid
      - run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Prompteur (dernier APK)
          files: app/build/outputs/apk/debug/*.apk
